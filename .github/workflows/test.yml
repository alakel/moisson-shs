name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          # Cache pip invalidé quand les versions testées changent.
          cache-dependency-path: |
            pyproject.toml
            constraints.txt

      # Versions testées figées par constraints.txt (dont mcp<2 : la série 2
      # retire les décorateurs Server.list_tools/call_tool/list_resources).
      - name: Install package + dev/mcp extras (versions testées)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mcp]" -c constraints.txt

      # UNE seule exécution de la suite : tests unitaires ET tests `sockets`
      # (uvicorn de test + client loopback : les runners autorisent les
      # sockets locales), seuil de couverture appliqué dans le même passage.
      # Seuls les tests `integration` (API réelles des fournisseurs) sont
      # écartés ici ; ils ont leur propre job.
      - name: Run tests (no external network) + coverage threshold
        run: |
          pytest tests/ -m "not integration" -v --cov=mappers --cov=utils --cov=connectors --cov-report=term-missing --cov-fail-under=70

  smoke:
    # Test léger d'intégration : import du package et vérification
    # que les entry_points fonctionnent. Pas d'appel réseau aux API SHS
    # pour éviter de saturer les serveurs publics et les faux positifs.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[mcp]" -c constraints.txt
      - name: Test CLI entry point
        run: |
          moisson-shs version
          moisson-shs --help
          moisson-shs setup --help
          moisson-shs setup --dry-run --skip-deps-check --output-dir /tmp/m_shs --config /tmp/claude.json
      - name: Test MCP server imports
        run: python -c "import mcp_server; print('OK')"

  integration:
    # Tests réseau des sources internationales. Les sources à clé sont 'skip'
    # au niveau du test quand la variable d'env (issue des secrets du dépôt)
    # est absente : le job ne tombe jamais en échec faute de secret. Limité aux
    # push pour ne pas solliciter les API depuis les forks/PRs externes.
    runs-on: ubuntu-latest
    needs: test
    if: ${{ github.event_name == 'push' }}
    env:
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
      SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
      CORE_API_KEY: ${{ secrets.CORE_API_KEY }}
      # tests/conftest.py retire les clés API de l'environnement des tests ;
      # cet opt-in conserve celles des sources GRATUITES ci-dessus, pour les
      # seuls tests marqués integration. La clé SerpAPI (source facturée) est
      # retirée dans tous les cas.
      MOISSON_TEST_REAL_KEYS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev,mcp]" -c constraints.txt
      # tests/test_sprint_01.py : trois vérifications légères des endpoints
      # Cairn et Isidore, marquées `integration` (elles tournaient auparavant,
      # non marquées, dans le job `test`).
      - name: Run integration tests (network; key-gated tests skip without secret)
        run: pytest tests/integration tests/test_sprint_01.py -m integration -v
