[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --strict-markers
    --tb=short
# Marqueurs : garder cette liste IDENTIQUE à celle de pyproject.toml
# ([tool.pytest.ini_options]), que ce fichier remplace quand les deux existent.
#   integration : appels réels aux API des fournisseurs (réseau externe).
#   sockets     : sockets locales seulement (uvicorn de test, client loopback) ;
#                 aucun réseau externe, mais interdit dans les bacs à sable
#                 sans sockets.
# Suite hors réseau et hors sockets : pytest -m "not integration and not sockets"
markers =
    integration: tests nécessitant le réseau
    sockets: tests ouvrant des sockets locales (serveur uvicorn de test, client HTTP loopback)
    slow: tests lents (> 5 s)
