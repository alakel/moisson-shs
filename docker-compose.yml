# Déploiement du serveur MCP distant moisson-shs derrière Caddy (TLS auto).
#
# Topologie : Caddy (443/80, seul exposé sur l'hôte) → app (uvicorn, port 8000
# interne au réseau Docker, JAMAIS publié sur l'hôte). 1 worker uvicorn
# (sessions Streamable HTTP stateful = process-local ; cf. DEPLOY.md).
#
# Démarrage : cp .env.example .env && éditer .env, puis `docker compose up -d`.

services:
  app:
    build:
      context: .
      args:
        # Commit du code (PAT-03) : MOISSON_BUILD_COMMIT=$(git rev-parse HEAD)
        # devant la commande de construction ; vide sinon.
        MOISSON_BUILD_COMMIT: ${MOISSON_BUILD_COMMIT:-}
    restart: unless-stopped
    env_file: .env
    environment:
      # Interne au réseau Docker uniquement (jamais publié — cf. `expose`).
      MOISSON_HTTP_HOST: "0.0.0.0"
      MOISSON_HTTP_PORT: "8000"
      MOISSON_OUTPUT_DIR: /data/output
      # MOISSON_API_TOKEN / MOISSON_ALLOWED_HOSTS / MOISSON_PUBLIC_BASE_URL
      # viennent du .env (env_file) — OBLIGATOIRES en HTTP.
    expose:
      - "8000"                # visible des autres conteneurs, PAS de l'hôte
    # PAS de `ports:` → le port interne n'est jamais accessible depuis l'hôte.
    volumes:
      - moisson_output:/data/output
      - moisson_cache:/data/cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Domaine + e-mail ACME consommés par le Caddyfile.
      MOISSON_DOMAIN: ${MOISSON_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data          # certificats Let's Encrypt (à sauvegarder)
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  moisson_output:
  moisson_cache:
  caddy_data:
  caddy_config:
